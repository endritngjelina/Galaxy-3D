<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced 3D Solar System</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background: #000011; 
      font-family: 'Arial', sans-serif;
    }
    
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      max-width: 300px;
      backdrop-filter: blur(10px);
    }
    
    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }
    
    .control-group {
      margin-bottom: 10px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #ccc;
    }
    
    input[type="range"] {
      width: 150px;
      margin-right: 10px;
    }
    
    button {
      background: #1a4d7a;
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin: 2px;
    }
    
    button:hover {
      background: #2a5d8a;
    }
    
    #planetInfo {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #333;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      max-width: 350px;
      backdrop-filter: blur(10px);
      display: none;
    }
    
    .planet-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #4da6ff;
    }
    
    .planet-detail {
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      padding: 0;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Solar System...</div>
  
  <div id="ui">
    <div id="info">
      <h3>3D Solar System Explorer</h3>
      <p>🖱️ Click and drag to orbit</p>
      <p>🔍 Scroll to zoom</p>
      <p>🪐 Click planets for detailed info</p>
      <p>🌙 Watch the moon phases!</p>
    </div>
    
    <div id="controls">
      <div class="control-group">
        <label>Animation Speed</label>
        <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1">
        <span id="speedValue">1x</span>
      </div>
      
      <div class="control-group">
        <button onclick="togglePause()">⏯️ Pause</button>
        <button onclick="resetView()">🏠 Reset View</button>
        <button onclick="toggleOrbits()">🔄 Toggle Orbits</button>
      </div>
      
      <div class="control-group">
        <button onclick="focusPlanet('Sun')">☀️ Sun</button>
        <button onclick="focusPlanet('Earth')">🌍 Earth</button>
        <button onclick="focusPlanet('Mars')">🔴 Mars</button>
        <button onclick="focusPlanet('Jupiter')">🪐 Jupiter</button>
      </div>
    </div>
    
    <div id="planetInfo">
      <button class="close-btn" onclick="closePlanetInfo()">×</button>
      <div id="planetDetails"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Global variables
    let scene, camera, renderer, controls;
    let planets = [];
    let sun, earth, moon;
    let animationSpeed = 1;
    let isPaused = false;
    let showOrbits = true;
    let orbitLines = [];
    
    // Planet data with realistic properties
    const planetData = [
      {
        name: 'Mercury',
        color: 0x8c7853,
        size: 0.4,
        distance: 8,
        speed: 0.02,
        tilt: 0.1,
        info: {
          diameter: '4,879 km',
          distance: '57.9 million km from Sun', 
          day: '59 Earth days',
          year: '88 Earth days',
          moons: '0',
          facts: 'Closest planet to the Sun with extreme temperature variations.'
        }
      },
      {
        name: 'Venus',
        color: 0xffc649,
        size: 0.7,
        distance: 12,
        speed: 0.015,
        tilt: 177.4,
        info: {
          diameter: '12,104 km',
          distance: '108.2 million km from Sun',
          day: '243 Earth days',
          year: '225 Earth days',
          moons: '0',
          facts: 'Hottest planet due to extreme greenhouse effect.'
        }
      },
      {
        name: 'Earth',
        color: 0x6b93d6,
        size: 0.8,
        distance: 16,
        speed: 0.01,
        tilt: 23.4,
        info: {
          diameter: '12,756 km',
          distance: '149.6 million km from Sun',
          day: '24 hours',
          year: '365.25 days',
          moons: '1 (Luna)',
          facts: 'The only known planet with life, 71% covered by water.'
        }
      },
      {
        name: 'Mars',
        color: 0xcd5c5c,
        size: 0.6,
        distance: 20,
        speed: 0.008,
        tilt: 25.2,
        info: {
          diameter: '6,792 km',
          distance: '227.9 million km from Sun',
          day: '24.6 hours',
          year: '687 Earth days',
          moons: '2 (Phobos, Deimos)',
          facts: 'The "Red Planet" with the largest volcano in the solar system.'
        }
      },
      {
        name: 'Jupiter',
        color: 0xfad5a5,
        size: 2.2,
        distance: 28,
        speed: 0.005,
        tilt: 3.1,
        info: {
          diameter: '142,984 km',
          distance: '778.5 million km from Sun',
          day: '9.9 hours',
          year: '11.8 Earth years',
          moons: '95+ known moons',
          facts: 'Largest planet, could fit 1,300+ Earths inside.'
        }
      },
      {
        name: 'Saturn',
        color: 0xfad5a5,
        size: 1.8,
        distance: 35,
        speed: 0.003,
        tilt: 26.7,
        info: {
          diameter: '120,536 km',
          distance: '1.43 billion km from Sun',
          day: '10.7 hours',
          year: '29.4 Earth years',
          moons: '146+ known moons',
          facts: 'Famous for its spectacular ring system.'
        }
      },
      {
        name: 'Uranus',
        color: 0x4fd0e4,
        size: 1.2,
        distance: 42,
        speed: 0.002,
        tilt: 97.8,
        info: {
          diameter: '51,118 km',
          distance: '2.87 billion km from Sun',
          day: '17.2 hours',
          year: '84 Earth years',
          moons: '27+ known moons',
          facts: 'Rotates on its side and has faint rings.'
        }
      },
      {
        name: 'Neptune',
        color: 0x4b70dd,
        size: 1.1,
        distance: 48,
        speed: 0.001,
        tilt: 28.3,
        info: {
          diameter: '49,528 km',
          distance: '4.5 billion km from Sun',
          day: '16.1 hours',
          year: '165 Earth years',
          moons: '16+ known moons',
          facts: 'Windiest planet with speeds up to 2,100 km/h.'
        }
      }
    ];

    function init() {
      // Scene setup
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // Camera controls (manual implementation)
      setupControls();

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040, 0.1);
      scene.add(ambientLight);

      const sunLight = new THREE.PointLight(0xffffff, 2, 200);
      sunLight.position.set(0, 0, 0);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      scene.add(sunLight);

      // Create starfield
      createStarfield();

      // Create sun
      createSun();

      // Create planets
      createPlanets();

      // Create orbit lines
      createOrbitLines();

      // Set initial camera position
      camera.position.set(30, 20, 50);
      camera.lookAt(0, 0, 0);

      // Remove loading screen
      document.getElementById('loading').style.display = 'none';

      // Start animation
      animate();
    }

    function createStarfield() {
      const starsGeometry = new THREE.BufferGeometry();
      const starVertices = [];
      const starColors = [];
      
      for (let i = 0; i < 15000; i++) {
        // Random position in sphere
        const radius = 800 + Math.random() * 400;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        
        starVertices.push(
          radius * Math.sin(phi) * Math.cos(theta),
          radius * Math.sin(phi) * Math.sin(theta),
          radius * Math.cos(phi)
        );
        
        // Random star colors
        const color = new THREE.Color();
        color.setHSL(Math.random() * 0.2 + 0.5, 0.3, 0.7 + Math.random() * 0.3);
        starColors.push(color.r, color.g, color.b);
      }
      
      starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
      starsGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
      
      const starsMaterial = new THREE.PointsMaterial({ 
        size: 2, 
        vertexColors: true,
        sizeAttenuation: false
      });
      
      const starField = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(starField);
    }

    function createSun() {
      const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
      const sunMaterial = new THREE.MeshBasicMaterial({ 
        color: 0xffff00,
        emissive: 0xffaa00,
        emissiveIntensity: 0.3
      });
      sun = new THREE.Mesh(sunGeometry, sunMaterial);
      sun.userData = { 
        name: 'Sun',
        info: {
          diameter: '1.39 million km',
          mass: '333,000 Earth masses',
          temperature: '5,778K surface',
          composition: '73% Hydrogen, 25% Helium',
          facts: 'Contains 99.86% of the Solar System\'s mass.'
        }
      };
      scene.add(sun);
    }

    function createPlanets() {
      planetData.forEach((data, index) => {
        // Create planet
        const geometry = new THREE.SphereGeometry(data.size, 32, 32);
        const material = new THREE.MeshStandardMaterial({ 
          color: data.color,
          roughness: 0.8,
          metalness: 0.1
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.x = data.distance;
        mesh.userData = { name: data.name, info: data.info };
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        
        // Add axial tilt
        mesh.rotation.z = (data.tilt * Math.PI) / 180;
        
        scene.add(mesh);
        planets.push({ mesh, data, angle: Math.random() * Math.PI * 2 });

        // Create Earth's moon
        if (data.name === 'Earth') {
          earth = mesh;
          createMoon();
        }

        // Create Saturn's rings
        if (data.name === 'Saturn') {
          createSaturnRings(mesh);
        }
      });
    }

    function createMoon() {
      const moonGeometry = new THREE.SphereGeometry(0.15, 16, 16);
      const moonMaterial = new THREE.MeshStandardMaterial({ 
        color: 0xaaaaaa,
        roughness: 0.9
      });
      
      moon = new THREE.Mesh(moonGeometry, moonMaterial);
      moon.position.x = 2.5; // Distance from Earth
      moon.userData = { 
        name: 'Moon',
        info: {
          diameter: '3,475 km',
          distance: '384,400 km from Earth',
          orbit: '27.3 days',
          facts: 'Same side always faces Earth due to tidal locking.'
        }
      };
      moon.castShadow = true;
      moon.receiveShadow = true;
      
      earth.add(moon); // Make moon a child of Earth
    }

    function createSaturnRings(saturn) {
      const ringGeometry = new THREE.RingGeometry(2.2, 3.5, 64);
      const ringMaterial = new THREE.MeshBasicMaterial({ 
        color: 0xaaaaaa,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6
      });
      
      const rings = new THREE.Mesh(ringGeometry, ringMaterial);
      rings.rotation.x = Math.PI / 2;
      saturn.add(rings);
    }

    function createOrbitLines() {
      planetData.forEach(data => {
        const points = [];
        for (let i = 0; i <= 64; i++) {
          const angle = (i / 64) * Math.PI * 2;
          points.push(new THREE.Vector3(
            Math.cos(angle) * data.distance,
            0,
            Math.sin(angle) * data.distance
          ));
        }
        
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ 
          color: 0x444444,
          transparent: true,
          opacity: 0.3
        });
        
        const orbitLine = new THREE.Line(geometry, material);
        scene.add(orbitLine);
        orbitLines.push(orbitLine);
      });
    }

    function setupControls() {
      let isMouseDown = false;
      let mouseX = 0, mouseY = 0;
      let targetRotationX = 0, targetRotationY = 0;
      let rotationX = 0, rotationY = 0;
      
      renderer.domElement.addEventListener('mousedown', (event) => {
        event.preventDefault();
        isMouseDown = true;
        mouseX = event.clientX;
        mouseY = event.clientY;
      });
      
      renderer.domElement.addEventListener('mousemove', (event) => {
        if (isMouseDown) {
          const deltaX = event.clientX - mouseX;
          const deltaY = event.clientY - mouseY;
          
          targetRotationY += deltaX * 0.01;
          targetRotationX += deltaY * 0.01;
          targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
          
          mouseX = event.clientX;
          mouseY = event.clientY;
        }
      });
      
      renderer.domElement.addEventListener('mouseup', () => {
        isMouseDown = false;
      });
      
      renderer.domElement.addEventListener('wheel', (event) => {
        event.preventDefault();
        const distance = camera.position.length();
        const newDistance = distance + event.deltaY * 0.01;
        camera.position.normalize().multiplyScalar(Math.max(10, Math.min(200, newDistance)));
      });

      // Click detection for planets
      renderer.domElement.addEventListener('click', onMouseClick);
      
      // Update camera rotation
      function updateControls() {
        rotationX += (targetRotationX - rotationX) * 0.1;
        rotationY += (targetRotationY - rotationY) * 0.1;
        
        const distance = camera.position.length();
        camera.position.x = distance * Math.sin(rotationY) * Math.cos(rotationX);
        camera.position.y = distance * Math.sin(rotationX);
        camera.position.z = distance * Math.cos(rotationY) * Math.cos(rotationX);
        camera.lookAt(0, 0, 0);
        
        requestAnimationFrame(updateControls);
      }
      updateControls();
    }

    function onMouseClick(event) {
      const mouse = new THREE.Vector2();
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      
      const clickableObjects = [...planets.map(p => p.mesh), sun];
      if (moon) clickableObjects.push(moon);
      
      const intersects = raycaster.intersectObjects(clickableObjects);
      
      if (intersects.length > 0) {
        const clickedObject = intersects[0].object;
        showPlanetInfo(clickedObject.userData);
      }
    }

    function showPlanetInfo(userData) {
      const planetInfo = document.getElementById('planetInfo');
      const planetDetails = document.getElementById('planetDetails');
      
      let content = `<div class="planet-title">${userData.name}</div>`;
      
      if (userData.info) {
        Object.entries(userData.info).forEach(([key, value]) => {
          if (key !== 'facts') {
            content += `<div class="planet-detail"><strong>${key.charAt(0).toUpperCase() + key.slice(1)}:</strong> ${value}</div>`;
          }
        });
        
        if (userData.info.facts) {
          content += `<div class="planet-detail"><strong>Fun Fact:</strong> ${userData.info.facts}</div>`;
        }
      }
      
      planetDetails.innerHTML = content;
      planetInfo.style.display = 'block';
    }

    function closePlanetInfo() {
      document.getElementById('planetInfo').style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);
      
      if (!isPaused) {
        const time = Date.now() * 0.001;
        
        // Animate planets
        planets.forEach((planet, index) => {
          planet.angle += planet.data.speed * animationSpeed * 0.1;
          planet.mesh.position.x = Math.cos(planet.angle) * planet.data.distance;
          planet.mesh.position.z = Math.sin(planet.angle) * planet.data.distance;
          
          // Rotate planet on its axis
          planet.mesh.rotation.y += 0.01 * animationSpeed;
        });
        
        // Animate moon phases and orbit
        if (moon && earth) {
          const moonAngle = time * 0.5; // Moon orbits faster
          moon.position.x = Math.cos(moonAngle) * 2.5;
          moon.position.z = Math.sin(moonAngle) * 2.5;
          
          // Moon rotation (tidal locking simulation)
          moon.rotation.y = moonAngle;
        }
        
        // Sun rotation
        sun.rotation.y += 0.005 * animationSpeed;
      }
      
      renderer.render(scene, camera);
    }

    // Control functions
    function togglePause() {
      isPaused = !isPaused;
    }

    function resetView() {
      camera.position.set(30, 20, 50);
      camera.lookAt(0, 0, 0);
    }

    function toggleOrbits() {
      showOrbits = !showOrbits;
      orbitLines.forEach(line => {
        line.visible = showOrbits;
      });
    }

    function focusPlanet(planetName) {
      let target;
      if (planetName === 'Sun') {
        target = sun;
      } else {
        const planetObj = planets.find(p => p.data.name === planetName);
        target = planetObj ? planetObj.mesh : null;
      }
      
      if (target) {
        const distance = planetName === 'Sun' ? 15 : 8;
        camera.position.copy(target.position);
        camera.position.y += distance * 0.3;
        camera.position.z += distance;
        camera.lookAt(target.position);
      }
    }

    // Speed control
    document.getElementById('speedSlider').addEventListener('input', (e) => {
      animationSpeed = parseFloat(e.target.value);
      document.getElementById('speedValue').textContent = animationSpeed + 'x';
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize the solar system
    init();
  </script>
</body>
</html>
