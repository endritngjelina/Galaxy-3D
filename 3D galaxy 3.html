<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Solar System Simulator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: radial-gradient(ellipse at center, #0c1445 0%, #000000 100%);
      font-family: 'Orbitron', monospace;
      overflow: hidden;
      color: #ffffff;
    }
    
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    .panel {
      background: linear-gradient(135deg, rgba(15, 32, 70, 0.9) 0%, rgba(5, 15, 35, 0.95) 100%);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 15px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 320px;
    }
    
    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 280px;
    }
    
    #timeline {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 800px;
    }
    
    #planetInfo {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 400px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    
    .hud-section {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(100, 200, 255, 0.2);
    }
    
    .hud-title {
      font-size: 14px;
      font-weight: 700;
      color: #64c8ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .hud-value {
      font-size: 12px;
      color: #ffffff;
      margin-bottom: 4px;
    }
    
    .control-group {
      margin-bottom: 15px;
    }
    
    .control-label {
      display: block;
      font-size: 11px;
      color: #64c8ff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    input[type="range"] {
      flex: 1;
      height: 6px;
      background: linear-gradient(to right, #1a4d7a, #64c8ff);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #64c8ff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
    }
    
    .btn {
      background: linear-gradient(135deg, #1a4d7a 0%, #2a5d8a 100%);
      border: 1px solid rgba(100, 200, 255, 0.3);
      color: #ffffff;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 2px;
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      background: linear-gradient(135deg, #2a5d8a 0%, #3a6d9a 100%);
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
    }
    
    .btn.active {
      background: linear-gradient(135deg, #64c8ff 0%, #4da6ff 100%);
      color: #000;
    }
    
    #timeline-slider {
      width: 100%;
      margin: 10px 0;
    }
    
    .timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64c8ff;
    }
    
    .planet-title {
      font-size: 18px;
      font-weight: 900;
      color: #64c8ff;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .planet-detail {
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: #64c8ff;
      font-size: 20px;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    
    .close-btn:hover {
      color: #ffffff;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1000;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(100, 200, 255, 0.3);
      border-top: 3px solid #64c8ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .view-mode {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    
    .asteroid-belt-info {
      font-size: 10px;
      color: #888;
      margin-top: 5px;
    }
    
    .warning {
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.3);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 10px;
    }
    
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .moon-phase {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }
    
    .phase-visual {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333;
      position: relative;
      overflow: hidden;
      margin-right: 10px;
      border: 1px solid #64c8ff;
    }
    
    .phase-fill {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #eee;
      border-radius: 50%;
    }
    
    .phase-label {
      font-size: 11px;
    }
    
    .notification {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 32, 70, 0.9);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 8px;
      padding: 10px 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="loading">
    <div class="loading-spinner"></div>
    <h2>INITIALIZING SOLAR SYSTEM</h2>
    <p>Loading celestial mechanics...</p>
  </div>

    </div>
    
    <div id="controls" class="panel">
      <div class="control-group">
        <label class="control-label">View Mode</label>
        <div class="view-mode">
          <button class="btn active" id="overviewBtn">Overview</button>
          <button class="btn" id="innerBtn">Inner System</button>
          <button class="btn" id="outerBtn">Outer System</button>
        </div>
      </div>
      
      <div class="control-group">
        <label class="control-label">Time Control</label>
        <div class="slider-container">
          <input type="range" id="timeSlider" min="-3" max="5" step="0.1" value="0">
          <span id="timeValue">1x</span>
        </div>
        <div class="view-mode" style="margin-top: 8px;">
          <button class="btn" id="pauseBtn">Pause</button>
          <button class="btn" id="resetTimeBtn">Reset</button>
        </div>
      </div>
      
      <div class="control-group">
        <label class="control-label">Visual Settings</label>
        <button class="btn active" id="orbitsBtn">Orbits: ON</button>
        <button class="btn active" id="labelsBtn">Labels: ON</button>
        <button class="btn" id="trailsBtn">Trails: OFF</button>
        <button class="btn active" id="asteroidsBtn">Asteroids: ON</button>
      </div>
      
      <div class="control-group">
        <label class="control-label">Quick Focus</label>
        <div class="view-mode">
          <button class="btn" onclick="simulator.focusObject('Sun')">☀️ Sun</button>
          <button class="btn" onclick="simulator.focusObject('Earth')">🌍 Earth</button>
          <button class="btn" onclick="simulator.focusObject('Mars')">🔴 Mars</button>
          <button class="btn" onclick="simulator.focusObject('Jupiter')">🪐 Jupiter</button>
        </div>
      </div>
      
      <div class="control-group">
        <label class="control-label">Camera Controls</label>
        <button class="btn" onclick="simulator.resetCamera()">Reset View</button>
        <button class="btn" id="autoRotateBtn">Auto Rotate</button>
      </div>
    </div>
    
    <div id="timeline" class="panel">
      <div class="hud-title">Timeline Control</div>
      <input type="range" id="timeline-slider" min="0" max="365" value="0">
      <div class="timeline-labels">
        <span>Jan 2024</span>
        <span>Apr 2024</span>
        <span>Jul 2024</span>
        <span>Oct 2024</span>
        <span>Dec 2024</span>
      </div>
    </div>
    
    <div id="planetInfo" class="panel">
      <button class="close-btn" onclick="simulator.closePlanetInfo()">×</button>
      <div id="planetDetails"></div>
    </div>
  </div>
  
  <div class="notification" id="notification"></div>

    const moonData = {
      'Luna': {
        name: 'Luna', parent: 'Earth', color: 0xaaaaaa, size: 0.273,
        distance: 4.0, orbitalPeriod: 27.32, tidalLock: true,

    class SolarSystemSimulator {
      constructor() {
        this.init();
      }

      init() {
        this.setupScene();
        this.setupCamera();
        this.setupRenderer();
        this.setupLights();
        this.setupControls();
        this.createStarfield();
        this.createSun();
        this.createPlanets();
        this.createMoons();
        this.createAsteroidBelt();
        this.createOrbitLines();
        this.setupEventListeners();
        this.startAnimation();
        this.hideLoading();
      }

      setupScene() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 100, 2000);
      }

      setupCamera() {
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        this.updateCameraPosition();
      }

      setupRenderer() {
        renderer = new THREE.WebGLRenderer({ 
          antialias: true, 
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
      }

      setupLights() {
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x404040, 0.05);
        scene.add(ambientLight);

        // Sun light
        const sunLight = new THREE.PointLight(0xffffff, 2, 300);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = 300;
        scene.add(sunLight);

        // Directional light for better visibility
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.1);
        dirLight.position.set(10, 10, 5);
        scene.add(dirLight);
      }

      setupControls() {
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const canvas = renderer.domElement;

        canvas.addEventListener('mousedown', (e) => {
          isDragging = true;
          previousMousePosition = { x: e.clientX, y: e.clientY };
          document.getElementById('cameraMode').textContent = 'Free';
          cameraController.mode = 'free';
        });

        canvas.addEventListener('mousemove', (e) => {
          if (!isDragging) return;

          const deltaMove = {
            x: e.clientX - previousMousePosition.x,
            y: e.clientY - previousMousePosition.y
          };

          if (cameraController.mode === 'free') {
            cameraController.theta -= deltaMove.x * 0.01;
            cameraController.phi -= deltaMove.y * 0.01;
            cameraController.phi = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraController.phi));
            this.updateCameraPosition();
          }

          previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mouseup', () => {
          isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          cameraController.distance += e.deltaY * 0.01;
          cameraController.distance = Math.max(5, Math.min(500, cameraController.distance));
          this.updateCameraPosition();
        });

        canvas.addEventListener('click', (e) => {
          this.onMouseClick(e);
        });
        
        // Window resize handling
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      updateCameraPosition() {
        if (cameraController.mode === 'free') {
          const x = cameraController.distance * Math.sin(cameraController.theta) * Math.cos(cameraController.phi);
          const y = cameraController.distance * Math.sin(cameraController.phi);
          const z = cameraController.distance * Math.cos(cameraController.theta) * Math.cos(cameraController.phi);
          
          camera.position.set(x, y, z);
          camera.lookAt(0, 0, 0);
        } else if (cameraController.mode === 'follow' && cameraController.target) {
          const target = cameraController.target;
          const offset = new THREE.Vector3(
            cameraController.distance * Math.sin(cameraController.theta),
            cameraController.distance * 0.3,
            cameraController.distance * Math.cos(cameraController.theta)
          );
          
          camera.position.copy(target.position).add(offset);
          camera.lookAt(target.position);
        }
      }

      createStarfield() {
        // Create multiple layers of stars for depth
        for (let layer = 0; layer < 3; layer++) {
          const starsGeometry = new THREE.BufferGeometry();
          const starVertices = [];
          const starColors = [];
          const starSizes = [];
          
          const starCount = 5000 - (layer * 1500);
          const depth = 500 + (layer * 200);
          
          for (let i = 0; i < starCount; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * depth;
            
            starVertices.push(x, y, z);
            
            // Star color - mostly white with some blue/red stars
            const color = new THREE.Color();
            if (Math.random() > 0.8) {
              color.setRGB(0.8, 0.8, 1.0); // Blue
            } else if (Math.random() > 0.9) {
              color.setRGB(1.0, 0.8, 0.8); // Red
            } else {
              color.setRGB(1.0, 1.0, 1.0); // White
            }
            starColors.push(color.r, color.g, color.b);
            
            // Star size
            const size = Math.random() * 1.5 + 0.5;
            starSizes.push(size);
          }
          
          starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
          starsGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
          starsGeometry.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));
          
          const starsMaterial = new THREE.PointsMaterial({
            size: 1.0,
            vertexColors: true,
            transparent: true,
            sizeAttenuation: true
          });
          
          const starField = new THREE.Points(starsGeometry, starsMaterial);
          scene.add(starField);
        }
      }

      createSun() {
        const sunGeometry = new THREE.SphereGeometry(5, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({
          color: 0xffff00,
          emissive: 0xffff33,
          emissiveIntensity: 1.0
        });
        
        sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);
      }

      createPlanets() {
        celestialBodies.forEach(body => {
          const planetGeometry = new THREE.SphereGeometry(body.size, 32, 32);
          const planetMaterial = new THREE.MeshLambertMaterial({ 
            color: body.color,
            emissive: body.type === 'planet' ? 0x000000 : 0x222222
          });
          
          const planet = new THREE.Mesh(planetGeometry, planetMaterial);
          planet.name = body.name;
          planet.userData = body;
          planets.push(planet);
          scene.add(planet);
          
          // Add planet label
          const label = this.createLabel(body.name, 0x64c8ff);
          label.position.set(0, body.size + 1, 0);
          planet.add(label);
          labelSprites.push({ label, planet });
        });
      }

      createMoons() {
        // Create Earth's moon
        const moonBody = moonData['Luna'];
        const moonGeometry = new THREE.SphereGeometry(moonBody.size, 32, 32);
        const moonMaterial = new THREE.MeshLambertMaterial({ 
          color: moonBody.color,
          emissive: 0x111111
        });
        
        moon = new THREE.Mesh(moonGeometry, moonMaterial);
        moon.name = moonBody.name;
        moon.userData = moonBody;
        moons.push(moon);
        
        // Find Earth and add moon as its child
        const earth = planets.find(p => p.name === 'Earth');
        if (earth) {
          earth.add(moon);
          moon.position.set(moonBody.distance, 0, 0);
          
          // Add moon label
          const label = this.createLabel('Luna', 0xcccccc);
          label.position.set(0, moonBody.size + 0.5, 0);
          moon.add(label);
          labelSprites.push({ label, planet: moon });
        }
        
        // Create Mars moons
        ['Phobos', 'Deimos'].forEach(moonName => {
          const moonBody = moonData[moonName];
          const moonGeometry = new THREE.SphereGeometry(moonBody.size, 16, 16);
          const moonMaterial = new THREE.MeshLambertMaterial({ 
            color: moonBody.color,
            emissive: 0x111111
          });
          
          const marsMoon = new THREE.Mesh(moonGeometry, moonMaterial);
          marsMoon.name = moonBody.name;
          marsMoon.userData = moonBody;
          moons.push(marsMoon);
          
          // Find Mars and add moon as its child
          const mars = planets.find(p => p.name === 'Mars');
          if (mars) {
            mars.add(marsMoon);
            const angle = Math.random() * Math.PI * 2;
            marsMoon.position.set(
              moonBody.distance * Math.cos(angle),
              0,
              moonBody.distance * Math.sin(angle)
            );
          }
        });
      }

      createLabel(text, color) {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = 256;
        canvas.height = 64;
        
        context.fillStyle = 'rgba(0, 0, 0, 0.7)';
        context.fillRect(0, 0, canvas.width, canvas.height);
        
        context.font = 'bold 24px Orbitron';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillStyle = `rgb(${(color >> 16) & 0xff}, ${(color >> 8) & 0xff}, ${color & 0xff})`;
        context.fillText(text, canvas.width/2, canvas.height/2);
        
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ 
          map: texture,
          transparent: true
        });
        
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(10, 2.5, 1);
        return sprite;
      }

      createAsteroidBelt() {
        const beltGeometry = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];
        
        const count = 2000;
        const innerRadius = 28;
        const outerRadius = 42;
        
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = innerRadius + Math.random() * (outerRadius - innerRadius);
          const height = (Math.random() - 0.5) * 5;
          
          const x = Math.cos(angle) * radius;
          const y = height;
          const z = Math.sin(angle) * radius;
          
          positions.push(x, y, z);
          
          // Asteroid color - mostly gray with some reddish
          const color = new THREE.Color();
          if (Math.random() > 0.8) {
            color.setRGB(0.7, 0.5, 0.4); // Reddish
          } else {
            color.setRGB(0.6, 0.6, 0.6); // Gray
          }
          colors.push(color.r, color.g, color.b);
        }
        
        beltGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        beltGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        
        const beltMaterial = new THREE.PointsMaterial({
          size: 0.2,
          vertexColors: true,
          transparent: true
        });
        
        const asteroidBelt = new THREE.Points(beltGeometry, beltMaterial);
        scene.add(asteroidBelt);
        asteroids.push(asteroidBelt);
      }

      createOrbitLines() {
        celestialBodies.forEach(body => {
          const orbitGeometry = new THREE.BufferGeometry();
          const vertices = [];
          
          const segments = 128;
          for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const x = Math.cos(angle) * body.semiMajorAxis;
            const z = Math.sin(angle) * body.semiMajorAxis * (1 - body.eccentricity);
            vertices.push(x, 0, z);
          }
          
          orbitGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
          
          const orbitMaterial = new THREE.LineBasicMaterial({
            color: 0x64c8ff,
            transparent: true,
            opacity: 0.3
          });
          
          const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
          scene.add(orbitLine);
          orbitLines.push(orbitLine);
        });
      }

      updatePlanetPositions(delta) {
        const timeFactor = timeScale * delta * 0.1;
        currentTime += timeFactor;
        
        // Update date display
        const date = new Date(2024, 0, 1);
        date.setDate(date.getDate() + Math.floor(currentTime));
        document.getElementById('currentDate').textContent = date.toISOString().split('T')[0];
        
        planets.forEach(planet => {
          const body = planet.userData;
          
          // Calculate position based on orbital parameters
          const orbitProgress = (currentTime / body.orbitalPeriod) % 1;
          const angle = orbitProgress * Math.PI * 2;
          
          // Apply elliptical orbit with eccentricity
          const x = Math.cos(angle) * body.semiMajorAxis;
          const z = Math.sin(angle) * body.semiMajorAxis * (1 - body.eccentricity);
          
          planet.position.set(x, 0, z);
          
          // Rotation
          const rotationSpeed = timeFactor / body.rotationPeriod;
          planet.rotation.y += rotationSpeed;
          
          // Update moon positions for Earth and Mars
          if (body.name === 'Earth' || body.name === 'Mars') {
            planet.children.forEach(child => {
              if (child.userData && child.userData.orbitalPeriod) {
                const moon = child;
                const moonBody = moon.userData;
                
                // Calculate moon position relative to planet
                const moonOrbitProgress = (currentTime / moonBody.orbitalPeriod) % 1;
                const moonAngle = moonOrbitProgress * Math.PI * 2;
                
                const moonX = Math.cos(moonAngle) * moonBody.distance;
                const moonZ = Math.sin(moonAngle) * moonBody.distance;
                
                moon.position.set(moonX, 0, moonZ);
              }
            });
          }
        });
        
        // Update labels to face camera
        labelSprites.forEach(({ label, planet }) => {
          label.lookAt(camera.position);
        });
      }

      onMouseClick(event) {
        const mouse = new THREE.Vector2();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
        
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        
        // Check for planet clicks
        const intersects = raycaster.intersectObjects(planets.concat(moons));
        
        if (intersects.length > 0) {
          const object = intersects[0].object;
          this.showPlanetInfo(object.userData);
          
          // If clicked on a moon, focus on its parent planet
          if (moons.includes(object)) {
            const parentPlanet = planets.find(p => p.name === object.userData.parent);
            if (parentPlanet) {
              this.focusObject(parentPlanet.name);
            }
          } else {
            this.focusObject(object.name);
          }
        }
      }

      showPlanetInfo(planetData) {
        const infoPanel = document.getElementById('planetInfo');
        const detailsDiv = document.getElementById('planetDetails');
        
        detailsDiv.innerHTML = `
          <div class="planet-title">${planetData.name}</div>
          <div class="planet-detail"><strong>Type:</strong> ${planetData.type}</div>
          <div class="planet-detail"><strong>Orbital Period:</strong> ${planetData.orbitalPeriod} Earth days</div>
          <div class="planet-detail"><strong>Rotation Period:</strong> ${Math.abs(planetData.rotationPeriod)} Earth days</div>
          <div class="planet-detail"><strong>Diameter:</strong> ${planetData.info.diameter}</div>
          <div class="planet-detail"><strong>Mass:</strong> ${planetData.info.mass}</div>
          <div class="planet-detail"><strong>Atmosphere:</strong> ${planetData.atmosphere}</div>
          <div class="planet-detail"><strong>Temperature:</strong> ${planetData.temperature.min}°C to ${planetData.temperature.max}°C</div>
          <div class="planet-detail"><strong>Facts:</strong> ${planetData.info.facts}</div>
        `;
        
        // Add moon phase info for Earth
        if (planetData.name === 'Earth') {
          const phase = this.calculateMoonPhase();
          detailsDiv.innerHTML += `
            <div class="moon-phase">
              <div class="phase-visual">
                <div class="phase-fill" style="clip-path: inset(0 ${50 - (phase * 25)}% 0 0);"></div>
              </div>
              <div class="phase-label">Moon Phase: ${this.getMoonPhaseName(phase)}</div>
            </div>
          `;
        }
        
        infoPanel.style.display = 'block';
      }

      calculateMoonPhase() {
        // Simplified moon phase calculation based on angle between Earth, Moon and Sun
        const earth = planets.find(p => p.name === 'Earth');
        if (!earth || !moon) return 0.5;
        
        const sunToEarth = new THREE.Vector3().subVectors(earth.position, sun.position).normalize();
        const earthToMoon = new THREE.Vector3().subVectors(moon.position, earth.position).normalize();
        
        // Angle between vectors - 0° = New Moon, 180° = Full Moon
        const angle = sunToEarth.angleTo(earthToMoon);
        const phase = (angle / Math.PI); // Normalize to 0-1 range
        
        return phase;
      }

      getMoonPhaseName(phase) {
        if (phase < 0.1) return "New Moon";
        if (phase < 0.35) return "Waxing Crescent";
        if (phase < 0.4) return "First Quarter";
        if (phase < 0.6) return "Waxing Gibbous";
        if (phase < 0.65) return "Full Moon";
        if (phase < 0.85) return "Waning Gibbous";
        if (phase < 0.9) return "Last Quarter";
        return "Waning Crescent";
      }

      closePlanetInfo() {
        document.getElementById('planetInfo').style.display = 'none';
      }

      focusObject(name) {
        const object = planets.find(p => p.name === name);
        if (!object) return;
        
        cameraController.mode = 'follow';
        cameraController.target = object;
        document.getElementById('cameraMode').textContent = `Following ${name}`;
        document.getElementById('focusTarget').textContent = name;
        
        // Set camera distance based on object size
        cameraController.distance = object.userData.size * 15;
        if (cameraController.distance < 10) cameraController.distance = 10;
        if (cameraController.distance > 200) cameraController.distance = 200;
        
        this.updateCameraPosition();
        this.showNotification(`Now focusing on ${name}`);
      }

      resetCamera() {
        cameraController.mode = 'free';
        cameraController.distance = 50;
        cameraController.theta = Math.PI/4;
        cameraController.phi = Math.PI/4;
        document.getElementById('cameraMode').textContent = 'Free';
        document.getElementById('focusTarget').textContent = 'None';
        this.updateCameraPosition();
        this.showNotification('Camera reset');
      }

      toggleAutoRotate() {
        autoRotate = !autoRotate;
        const btn = document.getElementById('autoRotateBtn');
        btn.textContent = autoRotate ? 'Auto Rotate: ON' : 'Auto Rotate: OFF';
        btn.classList.toggle('active', autoRotate);
        this.showNotification(autoRotate ? 'Auto rotation enabled' : 'Auto rotation disabled');
      }

      toggleOrbits() {
        showOrbits = !showOrbits;
        orbitLines.forEach(line => {
          line.visible = showOrbits;
        });
        const btn = document.getElementById('orbitsBtn');
        btn.textContent = `Orbits: ${showOrbits ? 'ON' : 'OFF'}`;
        btn.classList.toggle('active', showOrbits);
      }

      toggleLabels() {
        showLabels = !showLabels;
        labelSprites.forEach(({ label }) => {
          label.visible = showLabels;
        });
        const btn = document.getElementById('labelsBtn');
        btn.textContent = `Labels: ${showLabels ? 'ON' : 'OFF'}`;
        btn.classList.toggle('active', showLabels);
      }

      toggleTrails() {
        showTrails = !showTrails;
        const btn = document.getElementById('trailsBtn');
        btn.textContent = `Trails: ${showTrails ? 'ON' : 'OFF'}`;
        btn.classList.toggle('active', showTrails);
        this.showNotification(showTrails ? 'Trails enabled' : 'Trails disabled');
      }

      toggleAsteroids() {
        showAsteroids = !showAsteroids;
        asteroids.forEach(asteroid => {
          asteroid.visible = showAsteroids;
        });
        const btn = document.getElementById('asteroidsBtn');
        btn.textContent = `Asteroids: ${showAsteroids ? 'ON' : 'OFF'}`;
        btn.classList.toggle('active', showAsteroids);
      }

      showNotification(message) {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.style.opacity = '1';
        
        setTimeout(() => {
          notification.style.opacity = '0';
        }, 2000);
      }

      hideLoading() {
        document.getElementById('loading').style.display = 'none';
      }

      startAnimation() {
        const animate = () => {
          requestAnimationFrame(animate);
          
          // Calculate delta time for smooth animation
          const now = performance.now();
          const delta = Math.min((now - lastTime) / 1000, 0.1); // Cap delta to 100ms
          lastTime = now;
          
          // Update FPS counter every second
          frameCount++;
          if (now > lastTime + 1000) {
            document.getElementById('fps').textContent = Math.round(frameCount * 1000 / (now - lastTime));
            frameCount = 0;
            lastTime = now;
          }
          
          // Update planet positions
          if (!isPaused) {
            this.updatePlanetPositions(delta);
          }
          
          // Auto rotate camera
          if (autoRotate && cameraController.mode === 'free') {
            cameraController.theta += delta * cameraController.autoRotateSpeed * 0.1;
            this.updateCameraPosition();
          }
          
          renderer.render(scene, camera);
        };
        
        animate();
      }
    }

    // Initialize the simulator when the page loads
    document.addEventListener('DOMContentLoaded', () => {
      window.simulator = new SolarSystemSimulator();
      
      // Connect UI controls
      document.getElementById('timeSlider').addEventListener('input', (e) => {
        timeScale = Math.pow(10, parseFloat(e.target.value));
        document.getElementById('timeScale').textContent = timeScale.toFixed(1) + 'x';
        document.getElementById('timeValue').textContent = timeScale.toFixed(1) + 'x';
      });
      
      document.getElementById('pauseBtn').addEventListener('click', () => {
        isPaused = !isPaused;
        const btn = document.getElementById('pauseBtn');
        btn.textContent = isPaused ? 'Resume' : 'Pause';
        simulator.showNotification(isPaused ? 'Simulation paused' : 'Simulation resumed');
      });
      
      document.getElementById('resetTimeBtn').addEventListener('click', () => {
        currentTime = 0;
        simulator.showNotification('Time reset');
      });
      
      document.getElementById('autoRotateBtn').addEventListener('click', () => {
        simulator.toggleAutoRotate();
      });
      
      document.getElementById('orbitsBtn').addEventListener('click', () => {
        simulator.toggleOrbits();
      });
      
      document.getElementById('labelsBtn').addEventListener('click', () => {
        simulator.toggleLabels();
      });
      
      document.getElementById('trailsBtn').addEventListener('click', () => {
        simulator.toggleTrails();
      });
      
      document.getElementById('asteroidsBtn').addEventListener('click', () => {
        simulator.toggleAsteroids();
      });
      
      document.getElementById('overviewBtn').addEventListener('click', () => {
        cameraController.distance = 50;
        cameraController.theta = Math.PI/4;
        cameraController.phi = Math.PI/4;
        simulator.updateCameraPosition();
        document.querySelectorAll('.view-mode .btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('overviewBtn').classList.add('active');
        simulator.showNotification('View: Overview');
      });
      
      document.getElementById('innerBtn').addEventListener('click', () => {
        cameraController.distance = 30;
        cameraController.theta = Math.PI/4;
        cameraController.phi = Math.PI/4;
        simulator.updateCameraPosition();
        document.querySelectorAll('.view-mode .btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('innerBtn').classList.add('active');
        simulator.showNotification('View: Inner Planets');
      });
      
      document.getElementById('outerBtn').addEventListener('click', () => {
        cameraController.distance = 150;
        cameraController.theta = Math.PI/4;
        cameraController.phi = Math.PI/4;
        simulator.updateCameraPosition();
        document.querySelectorAll('.view-mode .btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('outerBtn').classList.add('active');
        simulator.showNotification('View: Outer Planets');
      });
    });
  </script>
</body>
</html>
